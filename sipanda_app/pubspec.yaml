name: sipanda_app
description: SIPANDA Disaster Mitigation System
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  fl_chart: ^0.65.0
  firebase_core: ^3.0.0
  cloud_firestore: ^5.0.0
  http: ^1.6.0
  excel: ^4.0.6
